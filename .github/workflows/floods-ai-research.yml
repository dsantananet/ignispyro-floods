name: Floods AI research (experimental, manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floods-ai-research
  cancel-in-progress: true
jobs:
  guards:
    if: github.ref == 'refs/heads/feature/floods-ai-research'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ML dependencies
        run: pip install -r ai/requirements.txt
      - name: Guard tests
        run: python -m unittest discover -s ai/tests -v
